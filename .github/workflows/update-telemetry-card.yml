name: Update Quantitative Telemetry SVG

on:
  schedule:
    # Runs every 6 hours to keep contribution signal and forecast up to date
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - ".github/scripts/generate_telemetry_svg.py"
      - ".github/workflows/update-telemetry-card.yml"

concurrency:
  group: telemetry-svg-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-svg:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate live telemetry & forecast SVG
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: python3 .github/scripts/generate_telemetry_svg.py

      - name: Commit and push updated SVG
        if: github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/quant-telemetry.svg
          if git diff --staged --quiet; then
            echo "No telemetry changes to commit."
          else
            git commit -m "chore(telemetry): update live contribution signal & forecast SVG [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "${{ github.ref_name }}"
          fi
